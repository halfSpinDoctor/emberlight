name: Release

# Push a tag such as v0.2.0 to build the app and attach it to a GitHub release.
on:
  push:
    tags: [ 'v*' ]

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Run core tests
        run: dotnet run --project tests/Emberlight.Tests -c Release

      - name: Publish (self-contained, single file, x64)
        run: >
          dotnet publish src/Emberlight.App/Emberlight.App.csproj -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true
          -p:DebugType=None -p:DebugSymbols=false -o artifacts/selfcontained

      - name: Zip
        run: Compress-Archive -Path artifacts/selfcontained/* -DestinationPath Emberlight-win-x64.zip

      # The tag's section of CHANGELOG.md ("## v0.2.1 ..." up to the next "## "), if there is one, goes at the top of
      # the release; GitHub's automatic list of commits follows it.
      - name: Release notes from CHANGELOG.md
        shell: pwsh
        run: |
          $lines = Get-Content CHANGELOG.md
          $start = [array]::FindIndex($lines, [Predicate[string]]{ param($l) $l -match "^## $([regex]::Escape('${{ github.ref_name }}'))(\s|$)" })
          $notes = @()
          if ($start -ge 0) {
            $notes = $lines[($start + 1)..($lines.Count - 1)]
            $end = [array]::FindIndex([string[]]$notes, [Predicate[string]]{ param($l) $l -match '^## ' })
            if ($end -eq 0) { $notes = @() } elseif ($end -gt 0) { $notes = $notes[0..($end - 1)] }
          }
          Set-Content release-notes.md (($notes -join "`n").Trim())

      - uses: softprops/action-gh-release@v3
        with:
          files: Emberlight-win-x64.zip
          body_path: release-notes.md
          generate_release_notes: true

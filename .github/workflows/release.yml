name: Release

# Push a tag such as v0.2.0 to build the app and attach it to a GitHub release.
on:
  push:
    tags: [ 'v*' ]

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Run core tests
        run: dotnet run --project tests/Emberlight.Tests -c Release

      - name: Publish (self-contained, single file, x64)
        run: >
          dotnet publish src/Emberlight.App/Emberlight.App.csproj -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true
          -p:DebugType=None -p:DebugSymbols=false -o artifacts/selfcontained

      - name: Zip
        run: Compress-Archive -Path artifacts/selfcontained/* -DestinationPath Emberlight-win-x64.zip

      - uses: softprops/action-gh-release@v2
        with:
          files: Emberlight-win-x64.zip
          generate_release_notes: true
